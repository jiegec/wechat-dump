[package]
name = "wechat-dump"
version = "0.1.0"
authors = ["Jiajie Chen <c@jia.je>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-async-std", "tls-native-tls"] }
async-std = { version = "1.12.0", features = ["attributes"] }
anyhow = "1.0.57"
roxmltree = "0.21.0"
chrono = "0.4.24"
indicatif = "0.18.0"
md5 = "0.8.0"
bytes = "1.11.1"
prost = "0.14.0"
clap = { version = "4.5.18", features = ["derive"] }

[build-dependencies]
prost-build = "0.14.0"
